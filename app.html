<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeFix Workspace</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/app.css"></head><body>
<header class="nav"><div class="wrap"><a class="brand" href="index.html"><b>&lt;/&gt;</b> CodeFix Generator</a>
<nav class="links" style="display:flex"><a href="index.html">Home</a><a href="#history">History</a></nav></div></header>
<main class="wrap ws">
<p class="status"><span class="dot"></span><span id="status">Loading local knowledge base…</span> · Rule-based, runs entirely in your browser.</p>
<div class="searchbar"><input id="q" type="search" placeholder="Search local knowledge, e.g. NullReferenceException" aria-label="Search"><div id="hits" class="hits"></div></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="panes"><section class="card pane"><h2 id="ptitle"></h2><form id="form" onsubmit="return false"></form></section>
<section class="card pane"><div class="rhead"><h2>Result</h2><div class="acts" id="acts" hidden><button class="btn sm" id="copy">Copy</button><button class="btn sm" id="dl">Download</button><button class="btn sm" id="clr">Clear</button></div></div><div id="msg" class="msg" role="status" hidden></div><div id="out"><p class="muted">Results appear here.</p></div></section></div>
<section id="history" class="card"><div class="rhead"><h2>History</h2><button class="btn sm" id="clrall">Clear all history</button></div><div id="hlist"></div></section>
</main>
<script src="js/data.js"></script><script src="js/rules.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script></body></html>
